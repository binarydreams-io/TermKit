name: CI
on: [push]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reference-snapshots:
    name: "Legacy TUIkit regression: SwiftUI reference snapshots"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: test -d /Applications/Xcode_26.6.app/Contents/Developer
      - run: ./scripts/generate-swiftui-reference-snapshots.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swiftui-reference-snapshots
          path: ${{ runner.temp }}/swiftui-reference-snapshots
  macos:
    name: SwiftTUI macOS and legacy TUIkit regression
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: sudo xcode-select --switch /Applications/Xcode_16.2.app/Contents/Developer
      - run: ./scripts/test-linux.sh macos
        env:
          TUIKIT_API_SNAPSHOT_OUTPUT: ${{ runner.temp }}/tuikit-macos-snapshots
          SWIFTTUI_TAGGED_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuikit-macos-snapshots
          path: ${{ runner.temp }}/tuikit-macos-snapshots
      - run: tar -czf "$RUNNER_TEMP/docc-output.tar.gz" -C docc-output .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: swifttui-docc-output
          path: ${{ runner.temp }}/docc-output.tar.gz
          if-no-files-found: error
  linux:
    name: SwiftTUI Linux and legacy TUIkit regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: ./scripts/test-linux.sh linux
        env:
          TUIKIT_API_SNAPSHOT_OUTPUT: ${{ runner.temp }}/tuikit-linux-snapshots
          SWIFTTUI_TAGGED_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tuikit-linux-snapshots
          path: ${{ runner.temp }}/tuikit-linux-snapshots
  performance:
    name: SwiftTUI release performance gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - run: |
          source scripts/toolchain.env
          test -d "$SWIFT_MACOS_XCODE_PATH"
          sudo xcode-select --switch "$SWIFT_MACOS_XCODE_PATH"
          swift --version | grep -F "Swift version $SWIFT_VERSION"
      - run: ./scripts/swifttui-benchmark.sh
  api-compatibility:
    name: Legacy TUIkit API compatibility regression
    needs: [reference-snapshots, macos, linux, performance]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: swiftui-reference-snapshots
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuikit-macos-snapshots
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tuikit-linux-snapshots
      - run: ./scripts/assemble-api-snapshot-set.sh
      - run: ./scripts/verify-compatibility-owner-registry.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-compatibility-inputs
          path: ${{ runner.temp }}/api-compatibility-inputs
