name: Performance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  timing:
    name: Timing benchmarks
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Swift toolchain
        run: |
          source scripts/toolchain.env
          [[ "$(swift --version | sed -n '1s/.*version \([0-9][0-9.]*\).*/\1/p')" == "$SWIFT_VERSION" ]]
      - name: Run 13 performance contracts
        run: ./scripts/run-benchmarks.sh "$RUNNER_TEMP/benchmarks"
      - name: Upload machine-readable results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: termkit-benchmarks-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmarks
          if-no-files-found: error
          retention-days: 30
