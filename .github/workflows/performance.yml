name: Performance

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  timing:
    name: Timing benchmarks
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify Swift toolchain
        run: |
          source scripts/toolchain.env
          [[ "$(swift --version | sed -n '1s/.*version \([0-9][0-9.]*\).*/\1/p')" == "$SWIFT_VERSION" ]]
      - name: Run 13 performance contracts
        run: ./scripts/run-benchmarks.sh "$RUNNER_TEMP/benchmarks"
      - name: Upload machine-readable results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: termkit-benchmarks-${{ github.run_id }}
          path: ${{ runner.temp }}/benchmarks
          if-no-files-found: error
          retention-days: 30
