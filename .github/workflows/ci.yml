name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Hygiene
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install pinned linters
        run: |
          source scripts/toolchain.env
          mkdir -p "$RUNNER_TEMP/bin"
          curl --fail --location --silent --show-error "$SWIFTLINT_MACOS_URL" --output "$RUNNER_TEMP/swiftlint.zip"
          printf '%s  %s\n' "$SWIFTLINT_MACOS_SHA256" "$RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q -j "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/bin"
          case "$RUNNER_ARCH" in
            ARM64)
              ACTIONLINT_URL="$ACTIONLINT_MACOS_ARM64_URL"
              ACTIONLINT_SHA256="$ACTIONLINT_MACOS_ARM64_SHA256"
              ;;
            X64)
              ACTIONLINT_URL="$ACTIONLINT_MACOS_X64_URL"
              ACTIONLINT_SHA256="$ACTIONLINT_MACOS_X64_SHA256"
              ;;
            *)
              printf 'Unsupported runner architecture: %s\n' "$RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error "$ACTIONLINT_URL" --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/actionlint.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/bin" actionlint
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the quality gate
        run: ./scripts/quality-gate.sh

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify Swift
        run: |
          source scripts/toolchain.env
          swift --version | grep -F "Swift version $SWIFT_VERSION"
      - name: Build and test
        run: |
          swift build --scratch-path "$RUNNER_TEMP/debug" -Xswiftc -warnings-as-errors
          swift build --scratch-path "$RUNNER_TEMP/release" -c release -Xswiftc -warnings-as-errors
          swift test --scratch-path "$RUNNER_TEMP/tests"
          swift build --package-path Examples --scratch-path "$RUNNER_TEMP/examples-build" -Xswiftc -warnings-as-errors
          swift test --package-path Examples --scratch-path "$RUNNER_TEMP/examples-tests"
      - name: Build documentation
        run: ./scripts/generate-documentation.sh "$RUNNER_TEMP/documentation"

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build and test in the pinned image
        run: ./scripts/test-linux.sh

  consumer:
    name: Consumer
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Verify a fresh consumer
        run: ./scripts/verify-consumer.sh

  image:
    name: Image
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run image fixtures and snapshots
        run: swift test --scratch-path "$RUNNER_TEMP/image-tests" --filter 'RasterImageTests|ImageRenderingTests'

  performance:
    name: Performance invariants
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Run deterministic scheduler and rendering checks
        run: >-
          swift test --scratch-path "$RUNNER_TEMP/performance-invariants"
          --filter 'FrameSchedulerTests|FramePresenterTests|RendererPropertyTests'
