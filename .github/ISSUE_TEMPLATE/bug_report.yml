name: Bug report
description: Report incorrect or unexpected TermKit behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve TermKit.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest program and exact commands that reproduce the problem.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: TermKit version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      description: Paste the first line from `swift --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: Include the terminal name, version, and `$TERM` value.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Add relevant output. Remove credentials and private data.
      render: shell
