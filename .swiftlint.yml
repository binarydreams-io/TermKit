# SwiftLint configuration for TermKit release sources.

# Only lint project sources (not build artifacts or dependencies)
included:
  - Sources/TermKit
  - Tests/TermKitTests
  - Examples/Sources
  - Examples/Tests

excluded:
  - .build
  - .swiftpm
  - Examples/.build
  - CompileFixtures

# Rules
disabled_rules:
  # Swift Testing uses descriptive backtick identifiers.
  - identifier_name
  # We use fatalError() intentionally in body properties for Renderable views
  - fatal_error_message
  # Nesting is acceptable for enums inside structs (e.g. Appearance.ID, GeneratedPalette.Hue)
  - nesting
  # BorderStyle.none follows SwiftUI convention (e.g. Font.Weight.none)
  - discouraged_none_name
  # SwiftFormat adds trailing commas.
  - trailing_comma
  # SwiftFormat places opening braces on new lines for wrapped signatures.
  - opening_brace
  # Explicit type names are clearer in generic value APIs and public factories.
  - prefer_self_in_static_references
  # Byte parsers intentionally use repairing UTF-8 conversion for terminal input.
  - optional_data_string_conversion
  # POSIX PTY APIs use the standardized master/slave endpoint terminology.
  - inclusive_language
  # Parser and runtime state machines are clearer as cohesive functions and files.
  - cyclomatic_complexity
  - function_body_length
  - file_length
  - type_body_length
  # Protocol composition syntax follows the Swift toolchain formatter.
  - comma_inheritance
  # Empty setters are required by static Animatable conformance.
  - unused_setter_value
  # Exact count assertions are clearer in tests than inverted emptiness checks.
  - empty_count
  # Completion APIs intentionally use a trailing operation closure.
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - operator_usage_whitespace
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - return_value_from_void_function
  - shorthand_optional_binding
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces
  - yoda_condition

# Rule Configuration
line_length:
  warning: 140
  error: 160
  ignores_urls: true
  ignores_comments: true

function_parameter_count:
  warning: 8
  error: 12

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - to
    - x
    - y

large_tuple:
  warning: 6
  error: 12

type_name:
  min_length:
    warning: 3
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - ID
    # Internal _Core views follow SwiftUI pattern (e.g. _AlertCore, _DialogCore)
    - _AlertCore
    - _DialogCore
    - _PanelCore
    - _CardCore
    - _ListCore
    - _ListContentView
    - _TableCore
    - _ImageCore
